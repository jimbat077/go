<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>正在前往檔案</title>
</head>
<body>
<p>正在前往檔案，如果沒有自動跳轉，請點 <a id="go" href="https://drive.google.com/drive/folders/1kUga6Q_EBkUezqYbdGhwNEP2MGBAHgkW?usp=drive_link">這裡</a>。</p>
<script>
var driveUrl = "https://drive.google.com/drive/folders/1kUga6Q_EBkUezqYbdGhwNEP2MGBAHgkW?usp=drive_link";
var expiry = new Date("2026-11-28T23:59:59+08:00");
if (new Date() > expiry) {
  document.body.innerHTML = "<p>這個連結已經過期了。</p>";
} else {
  location.replace(driveUrl);
}
</script>
</body>
</html>
